version: '3.8'

# Credentials have no defaults: copy .env.example to .env and fill in
# MONGO_INITDB_ROOT_USERNAME, MONGO_INITDB_ROOT_PASSWORD and JWT_SECRET
# before `docker compose up`, or compose refuses to start. The API runs
# with NODE_ENV=production unless .env overrides it, so the server's
# JWT_SECRET check applies. MongoDB is published on 127.0.0.1 only.

services:
  mongodb:
    image: mongo:latest
    container_name: financial-tracker-db
    restart: always
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?set MONGO_INITDB_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?set MONGO_INITDB_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: financial-tracker
    volumes:
      - mongodb_data:/data/db
    networks:
      - financial-tracker-network

  backend:
    build: ./backend
    container_name: financial-tracker-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/financial-tracker?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -hex 32)}
      NODE_ENV: ${NODE_ENV:-production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - financial-tracker-network

  frontend:
    build: ./frontend
    container_name: financial-tracker-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - financial-tracker-network

volumes:
  mongodb_data:

networks:
  financial-tracker-network:
    driver: bridge